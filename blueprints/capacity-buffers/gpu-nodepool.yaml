apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-capacity-buffer
spec:
  # limits are a NodePool-wide safety ceiling, not the buffer's own cap (that's
  # capacity-buffer-gpu.yaml's spec.limits). Set generously since instance
  # category is left open below and p-family instances carry far more GPUs,
  # CPU, and memory per node than g-family.
  limits:
    cpu: 400
    memory: 2000Gi
    nvidia.com/gpu: 16
  template:
    metadata:
      labels:
        intent: gpu-capacity-buffer
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        name: gpu-capacity-buffer
        kind: EC2NodeClass
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["g", "p"]
        - key: karpenter.k8s.aws/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-capacity-buffer
spec:
  amiSelectorTerms:
  - alias: bottlerocket@latest
  role: "<<KARPENTER_NODE_IAM_ROLE_NAME>>"
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: <<CLUSTER_NAME>>
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: <<CLUSTER_NAME>>
