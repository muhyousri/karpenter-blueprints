apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 2 # the existing app, already running before you add a buffer for it
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      nodeSelector:
        intent: capacity-buffer
      tolerations:
        - key: intent
          value: capacity-buffer
          effect: NoSchedule
      containers:
      - name: web-app
        image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
