apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      nodeSelector:
        intent: capacity-buffer
      tolerations:
        - key: intent
          value: capacity-buffer
          effect: NoSchedule
      containers:
      - name: api-service
        image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
