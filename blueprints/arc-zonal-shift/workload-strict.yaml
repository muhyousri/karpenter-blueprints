# ANTI-PATTERN: This workload uses DoNotSchedule topology constraints.
# During a zonal shift, evicted pods from the impaired AZ will be stuck
# in Pending because the scheduler cannot place them without violating maxSkew.
# Use ScheduleAnyway (see workload.yaml) for workloads that should survive a zonal shift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-strict
spec:
  replicas: 6
  selector:
    matchLabels:
      app: web-app-strict
  template:
    metadata:
      labels:
        app: web-app-strict
    spec:
      nodeSelector:
        intent: arc-zonal-shift
      tolerations:
        - key: "intent"
          operator: "Equal"
          value: "arc-zonal-shift"
          effect: "NoSchedule"
      containers:
        - name: web-app
          image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 512m
              memory: 512Mi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: web-app-strict
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
        - labelSelector:
            matchLabels:
              app: web-app-strict
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
