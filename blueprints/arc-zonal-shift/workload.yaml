apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-zonal
spec:
  replicas: 6
  selector:
    matchLabels:
      app: web-app-zonal
  template:
    metadata:
      labels:
        app: web-app-zonal
    spec:
      nodeSelector:
        intent: arc-zonal-shift
      tolerations:
        - key: "intent"
          operator: "Equal"
          value: "arc-zonal-shift"
          effect: "NoSchedule"
      containers:
        - name: web-app
          image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 512m
              memory: 512Mi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: web-app-zonal
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
        - labelSelector:
            matchLabels:
              app: web-app-zonal
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
